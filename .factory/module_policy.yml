classifications:
  - CORE
  - OPERATIONS
  - ADVANCED
  - INFRASTRUCTURE
  - INTEGRATION
  - UI
  - DEV
  - TEST
  - HARDWARE
  - LEGACY
  - UNCLASSIFIED

rules:
  test_prefix_classification: TEST
  hardware_patterns:
    - "stock_vertical_lift*"
    - "stock_vlm_*"
  infrastructure_patterns:
    - "queue_job*"
    - "server_tools*"
    - "base_external_*"
    - "bus_alt_connection"
    - "dbfilter_from_header"
    - "session_db"

